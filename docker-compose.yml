services:
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    container_name: social_server
    restart: unless-stopped
    ports:
      - "3000:3000"      
    env_file:
      - ./server/.env.docker
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - social-network
    volumes: 
      - ./server/src:/app/src
      - ./server/workers:/app/workers
      - /app/dist
  

  redis:
    image: redis:alpine
    container_name: social_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: social_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    
      - "15672:15672"  
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: strongpassword123
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  nginx:
    image: nginx:alpine
    container_name: social_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - social-network

volumes:
  rabbitmq_data:
    driver: local

networks:
  social-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16




